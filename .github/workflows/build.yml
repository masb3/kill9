name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./build-app.sh

      - name: Zip
        run: ditto -c -k --keepParent build/Kill9.app Kill9.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kill9
          path: Kill9.zip

      - name: Publish release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Kill9 ${{ inputs.version }}
          files: Kill9.zip
          generate_release_notes: true
